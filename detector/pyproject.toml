[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "avoid-pp-detector"
version = "0.0.0"
description = "Python workspace for Finnish-first translation guard detection"
requires-python = ">=3.13,<3.14"
dependencies = []

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "mypy==2.4.0",
    "ruff==0.16.10",
]

[tool.uv]
required-version = "==0.12.15"

[tool.hatch.build.targets.wheel]
packages = ["src/translation_guard"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]

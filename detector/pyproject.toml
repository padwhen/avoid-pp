[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "avoid-pp-detector"
version = "0.0.0"
description = "Python workspace for Finnish-first translation guard detection"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.143.0",
    "pydantic>=2.14.0",
    "pydantic-settings>=2.15.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "mypy==2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pyyaml>=6.0.3",
    "ruff==0.16.10",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.uv]
required-version = "==0.12.15"

[tool.hatch.build.targets.wheel]
packages = ["src/translation_guard"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]

# Local development topology for the C01-C12 slice.
#
# Two properties matter more than convenience here:
#
#   * The detector is private. It publishes no host port, so it is reachable
#     only from the gateway over the internal network. A detector exposed to
#     the host would let anything on the machine request an assessment
#     directly, bypassing the gateway's validation, limits and policy.
#   * Everything runs in fake mode. No provider credential is read, and no
#     paid API is called. Live inference arrives at C13 behind its own
#     configuration.
#   * The gateway's caller credentials have no default. There is no key in
#     this file to forget to change; `make dev-key` generates one into the
#     gitignored .env, and Compose refuses to start without it.

name: avoid-pp

services:
  detector:
    build:
      context: ./detector
    environment:
      AVOIDPP_DETECTOR_MODE: fake
      AVOIDPP_DETECTOR_DETECTOR_VERSION: fake-0
      # The detector's own concurrency bound, set above the gateway's so the
      # gateway sheds first. A rejection here means something is calling the
      # detector directly, which is worth surfacing.
      AVOIDPP_DETECTOR_MAX_ACTIVE: ${AVOIDPP_DETECTOR_MAX_ACTIVE:-8}
      AVOIDPP_DETECTOR_MAX_WAITING: ${AVOIDPP_DETECTOR_MAX_WAITING:-16}
    # Deliberately no `ports:`. Reachable at http://detector:9000 on the
    # internal network and nowhere else.
    networks:
      - internal
    healthcheck:
      # The image has no curl or wget, so the check uses the interpreter that
      # is already present. /readyz fails until the detector has started.
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:9000/readyz', timeout=2).status == 200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  gateway:
    build:
      context: ./gateway
    environment:
      AVOIDPP_ADDR: ":8080"
      AVOIDPP_DETECTOR_URL: http://detector:9000
      AVOIDPP_POLICY_MODE: ${AVOIDPP_POLICY_MODE:-monitoring}
      # No default. A development key committed to the repository would be a
      # public credential, so Compose fails here instead of substituting one.
      AVOIDPP_API_KEYS: ${AVOIDPP_API_KEYS:?run `make dev-key` to generate one into .env}
      # rate/burst. These bound spend before they bound load: a live scan
      # costs roughly a cent, so the global default caps a runaway loop near
      # a dollar a minute rather than in the thousands.
      AVOIDPP_RATE_CALLER: ${AVOIDPP_RATE_CALLER:-1/5}
      AVOIDPP_RATE_GLOBAL: ${AVOIDPP_RATE_GLOBAL:-2/10}
      AVOIDPP_RATE_UNAUTHENTICATED: ${AVOIDPP_RATE_UNAUTHENTICATED:-2/10}
      # Concurrency, which is a different question from arrival rate: at 4.4
      # seconds a call, two requests per second leaves roughly nine in flight.
      AVOIDPP_MAX_ACTIVE: ${AVOIDPP_MAX_ACTIVE:-4}
      AVOIDPP_MAX_QUEUED: ${AVOIDPP_MAX_QUEUED:-8}
      AVOIDPP_LOG_LEVEL: ${AVOIDPP_LOG_LEVEL:-info}
    ports:
      # The only thing published to the host. 8099 by default because 8080 is
      # commonly taken by another local service.
      - "${AVOIDPP_HOST_PORT:-8099}:8080"
    depends_on:
      detector:
        condition: service_healthy
    networks:
      - internal
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

networks:
  internal:
    driver: bridge

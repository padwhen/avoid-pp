name: checks

# Fast, offline checks. These run the same Make targets documented in the
# README, so a green run here means the documented local commands work on a
# machine that is not the author's.
#
# No LLM provider is contacted and no secret is referenced. Live-model
# evaluation is a separate, opt-in workflow introduced later (C13+), with its
# own credentials and cost ceiling.

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Go, Python and contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          # gateway has no external modules yet, so there is no go.sum to key
          # a cache on. Re-enable with cache-dependency-path when one exists.
          cache: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          # Must match tool.uv required-version in detector/pyproject.toml.
          version: "0.12.15"
          enable-cache: true
          cache-dependency-glob: detector/uv.lock

      - name: Report toolchain
        run: |
          go version
          uv --version

      # Verifies C01-AC1 on a clean checkout: resolves Go modules and installs
      # locked Python dependencies, provisioning the pinned interpreter.
      - name: Bootstrap
        run: make bootstrap

      # C01-AC1 again: bootstrap must not rewrite manifests or the lockfile.
      - name: Bootstrap left the tree unchanged
        run: git diff --exit-code

      - name: Check Go
        run: make check-go

      - name: Check Python
        run: make check-python

      - name: Check contracts
        run: make check-contracts

      # C04-AC2: the contract validator must reject deliberately bad data.
      - name: Contract validator self-test
        run: make check-contracts-selftest

      # The SDK is a second Go module and a path-based Python package, so
      # neither `./...` in gateway/ nor the detector project's own checks see
      # it. Named explicitly, or it would be unbuilt code that looks covered.
      - name: Check SDK clients
        run: make check-sdk

      - name: Check examples
        run: make check-examples

      # The evaluation checks were missing from this workflow until C26, so
      # the dataset validator and the metric fixtures had only ever run
      # locally - including C25's published-interval checks and the assertion
      # that both release gates read UNDETERMINED at the seed corpus size.
      - name: Check dataset
        run: make check-evals

      - name: Evaluation runner self-test
        run: make check-evals-runner

      # C26-AC2: splits must stay stable and groups must not span them. These
      # properties are permanent - a holdout that moved cannot be un-moved,
      # and nobody would notice from a diff.
      - name: Split stability and holdout protection
        run: make check-splits

      - name: Duplicate and leakage review
        run: make check-duplicates

      # C30: the gate report cites four measurement reports and a corpus. A
      # published number that quietly stops describing its inputs is worse
      # than no number, so the citation is checked rather than trusted.
      - name: Gate report provenance
        run: make check-gate-report

      # A paid tool that runs without confirmation is a bug that costs money.
      # One did, so the guard now has a test.
      - name: Spend guards
        run: make check-spend-guards

      # C04-AC3: nothing above may depend on a provider credential. Asserted
      # rather than asserted-in-prose, so adding one to this workflow fails.
      - name: No provider credentials required
        run: |
          if grep -rnE '\$\{\{ *secrets\.' .github/workflows; then
            echo "::error::Default checks must not reference repository secrets."
            exit 1
          fi
          echo "No secrets referenced by any workflow."

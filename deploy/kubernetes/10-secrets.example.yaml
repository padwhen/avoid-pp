# A template. The real Secret is created out of band and never committed.
#
#   kubectl -n avoid-pp create secret generic avoidpp-gateway \
#     --from-literal=AVOIDPP_API_KEYS="caller:translate_fi_en_v1:$(openssl rand -hex 24)"
#
#   kubectl -n avoid-pp create secret generic avoidpp-detector \
#     --from-literal=LLM_API_KEY="sk-..."
#
# ## Why the keys are env vars and not a mounted file
#
# A mounted Secret updates in place when the Secret changes, which sounds
# like free rotation and is not: the process has already read the value, and
# nothing tells it to read again. Both services load configuration once at
# startup - deliberately, since C19 validates credentials there and refuses
# to start on a bad one - so a rotation is a restart either way.
#
# Env vars make that honest. A changed Secret visibly does nothing until the
# Deployment is rolled, which is what the rotation drill in
# deploy/kubernetes/smoke.sh exercises.
apiVersion: v1
kind: Secret
metadata:
  name: avoidpp-gateway
  namespace: avoid-pp
type: Opaque
stringData:
  # name:task:key, semicolon separated for more than one caller.
  AVOIDPP_API_KEYS: "REPLACE-ME:translate_fi_en_v1:REPLACE-WITH-32-PLUS-CHARACTERS"
---
apiVersion: v1
kind: Secret
metadata:
  name: avoidpp-detector
  namespace: avoid-pp
type: Opaque
stringData:
  # Only read when AVOIDPP_DETECTOR_MODE is live. Fake mode needs no key,
  # which is why the default deployment below does not set the mode.
  LLM_API_KEY: "REPLACE-ME"

# The detector, as a Fly app with no public address and the provider key.
#
#   fly apps create avoid-pp-detector
#   fly secrets set -a avoid-pp-detector LLM_API_KEY="<key>"
#   fly deploy -a avoid-pp-detector -c deploy/fly/detector.fly.toml --dockerfile detector/Dockerfile
#
# Private for a stronger reason than the gateway: anything that can reach
# this can request an assessment directly, bypassing the gateway's
# validation, authentication, rate limits and policy. It holds the provider
# credential and every call it serves costs money.
#
# Fly's private network is flat within an organisation, so this is reachable
# by any app in the org rather than by the gateway alone - unlike the
# Kubernetes deployment, where a NetworkPolicy restricts it to the gateway
# and a drill proves it. That is a real difference in posture and the reason
# the Kubernetes manifests exist alongside this.

app = 'avoid-pp-detector'
primary_region = 'arn'

[build]
  dockerfile = '../../detector/Dockerfile'

# Fly's private network is IPv6 only, and the image's CMD binds 0.0.0.0 -
# which is IPv4. The result is a detector that starts, passes its own health
# check, and refuses every connection from the gateway in about 5 ms. So the
# command is overridden here to bind `::`, which accepts both.
#
# This is a deployment concern rather than an image one: Compose and the
# Kubernetes manifests are IPv4 and work with the image default.
[processes]
  app = "uvicorn translation_guard.api:app --host :: --port 9000"

# AVOIDPP_DETECTOR_HOST and AVOIDPP_DETECTOR_PORT are deliberately unset:
# they are real settings that this image does not consult, because the
# command above passes --host and --port directly.
[env]
  # Live, which is the only reason to deploy this at all. Fake mode is for
  # development and CI, and a deployed fake detector is a service that
  # returns well-formed verdicts about nothing.
  AVOIDPP_DETECTOR_MODE = 'live'
  AVOIDPP_DETECTOR_MODEL = 'claude-opus-5'

  # Under the gateway's scan budget, so the detector gives up first and the
  # gateway reports a detector timeout rather than its own.
  AVOIDPP_DETECTOR_REQUEST_TIMEOUT_SECONDS = '12'

  # Above the gateway's MaxActive on purpose: in normal operation the gateway
  # sheds first and this never fires, so a rejection here means something is
  # calling the detector directly.
  AVOIDPP_DETECTOR_MAX_ACTIVE = '16'
  AVOIDPP_DETECTOR_MAX_WAITING = '32'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1

[machine]
  auto_stop_machines = false
  min_machines_running = 1
